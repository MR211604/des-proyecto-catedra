<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Cliente - Confecciones Azucena</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffd7f4",

                        "primary-container": "#8b5e83",
                        "on-tertiary-fixed": "#1f1a20",
                        "on-tertiary-fixed-variant": "#4b454c",
                        "on-secondary-fixed-variant": "#613c45",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-background": "#1f1a20",
                        "surface-container-highest": "#e9dfe9",
                        "secondary": "#7b535c",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#ffd9e0",
                        "surface-dim": "#e1d7e0",
                        "error": "#ba1a1a",
                        "background": "#fff7fc",
                        "outline-variant": "#d1c2cb",
                        "surface-bright": "#fff7fc",
                        "inverse-primary": "#ecb6e0",
                        "tertiary-fixed": "#eadfe9",
                        "surface-container-high": "#efe5ef",
                        "surface-variant": "#e9dfe9",
                        "on-primary-container": "#ffeaf7",
                        "error-container": "#ffdad6",
                        "primary": "#70466a",
                        "secondary-container": "#fecad4",
                        "on-surface": "#1f1a20",
                        "on-secondary-container": "#7a525b",
                        "on-secondary-fixed": "#2f121a",
                        "inverse-on-surface": "#f8eef7",
                        "surface-container": "#f5ebf4",
                        "surface": "#fff7fc",
                        "on-tertiary-container": "#f7ecf5",
                        "tertiary-container": "#726a72",
                        "surface-tint": "#7b5074",
                        "outline": "#80747b",
                        "tertiary": "#59525a",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#fbf1fa",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                    },
                    "spacing": {

                        "base": "8px"
                    },
                    "fontFamily": {

                        "label-md": ["Inter"],
                        "display": ["Inter"],

                }
            }
        }

<style>
        body { font-family: 'Inter', sans-serif; }
        .input-base {
            @apply w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg px-md py-sm font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors;
        }
        .btn-primary {
            @apply bg-primary-container text-on-primary font-label-md px-lg py-[10px] rounded h-[40px] flex items-center justify-center hover:opacity-90 transition-opacity;
        }
        .btn-secondary {
            @apply bg-surface-container-lowest border-[1.5px] border-primary-container text-primary-container font-label-md px-lg py-[10px] rounded h-[40px] flex items-center justify-center hover:bg-surface-container-low transition-colors;
        }
    </style>
</head>
<body class="bg-background text-on-background flex min-h-screen">
<!-- Suppressed SideNavBar/BottomNavBar due to Linear/Transactional Form nature (Adding New Entity) -->
<div class="flex-1 flex flex-col min-h-screen">
<!-- TopNavBar - Simplified for transactional view -->
<header class="w-full h-16 bg-surface flex justify-between items-center px-lg border-b border-outline-variant sticky top-0 z-50">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs font-body-md">
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
                     Back to clients list
                 </button>
</div>
<div class="font-headline-md text-headline-md text-primary">Confecciones Azucena</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto p-margin-mobile md:p-margin-desktop flex justify-center bg-[#F8F6F7]">
<div class="w-full max-w-[800px] bg-white rounded-xl shadow-[0_4px_12px_rgba(47,41,48,0.05)] p-lg md:p-xl">
<div class="mb-xl border-b border-outline-variant/30 pb-lg">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Registrar Nuevo Cliente</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Complete los detalles para agregar un nuevo perfil al sistema del atelier.</p>
</div>
<form class="space-y-xxl">
<!-- Section 1: Personal Information -->
<section>
<h2 class="font-title-lg text-title-lg text-primary-container mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined">person</span>
                            Personal Information
                        </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Full Name <span class="text-error">*</span></label>
<input class="input-base" placeholder="Ej: Maria Rodriguez" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Phone <span class="text-error">*</span></label>
<input class="input-base" placeholder="+34 600 000 000" type="tel"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Email</label>
<input class="input-base" placeholder="maria@ejemplo.com" type="email"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Address</label>
<input class="input-base" placeholder="Calle Principal 123" type="text"/>
</div>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Section 2: Additional Information -->
<section>
<h2 class="font-title-lg text-title-lg text-primary-container mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined">info</span>
                            Additional Information
                        </h2>
<div class="grid grid-cols-1 gap-lg">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Notes</label>
<textarea class="input-base min-h-[100px] resize-y" placeholder="Cualquier detalle relevante sobre el cliente..."></textarea>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Client Preferences</label>
<input class="input-base" placeholder="Ej: Prefiere telas de algodón, alergia a la lana..." type="text"/>
</div>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Section 3: Client Measurements -->
<section>
<div class="flex items-center gap-sm mb-lg">
<h2 class="font-title-lg text-title-lg text-primary-container flex items-center gap-sm">
<span class="material-symbols-outlined">straighten</span>
                                Client Measurements
                            </h2>
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-sm py-[2px] rounded-full">Optional</span>
</div>
<div class="bg-surface-container-low rounded-lg p-lg border border-outline-variant/20">
<div class="grid grid-cols-2 md:grid-cols-3 gap-md mb-lg">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Chest (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Waist (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Hips (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Sleeve Length (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Garment Length (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Shoulders (cm)</label>
<input class="input-base" placeholder="0.0" type="number"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block">Measurement Observations</label>
<input class="input-base" placeholder="Detalles específicos sobre la toma de medidas..." type="text"/>
</div>
</div>
</section>
<!-- Form Actions -->
<div class="flex justify-end gap-md pt-lg border-t border-outline-variant/30 mt-xxl">
<button class="btn-secondary" type="button">Cancelar</button>
<button class="btn-primary" type="submit">Guardar Cliente</button>
</div>
</form>
</div>
</main>
</div>
</body></html>
