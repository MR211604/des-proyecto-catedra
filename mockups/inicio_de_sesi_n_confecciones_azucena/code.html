<body class="bg-background min-h-screen text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="flex min-h-screen w-full">
<!-- Left Panel: Illustration (Hidden on Mobile) -->
<div class="hidden lg:flex w-1/2 relative bg-surface-container-highest items-center justify-center overflow-hidden">
<img alt="Sewing machine illustration" class="absolute inset-0 w-full h-full object-cover object-center mix-blend-multiply opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQKihEWywy_1tya_PQbfh5-oCqqTCQnIcOXRkLKIgITgaf29_f7S2hH6hIPszjN_XIWJeSfeRZQx8k-QODQgIhsvO-1BAeDXDEyQFiQZKZmYQU7RPOD28wnXYRvtRuZ4pjyjCW30-tpZXMZwzGVbbLVvS1Otj3AVUd5Cmh4FhLDRxAlXcdgUxlOt_r2uzxKJMF8QIYRbRz38pKJqxa7MQUK6zi-XLaR28MjmJN27MtM5eIxLikFxoT7A"/>
<!-- Subtle gradient overlay to ensure image blends elegantly -->
<div class="absolute inset-0 bg-gradient-to-tr from-surface-tint/10 to-transparent pointer-events-none"></div>
</div>
<!-- Right Panel: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-gutter">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl p-xl md:p-xxl shadow-[0_4px_12px_rgba(47,41,48,0.05)] border border-surface-variant">
<!-- Header -->
<div class="text-center mb-xl">
<div class="mx-auto w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center mb-md text-primary-container">
<span class="material-symbols-outlined" style="font-size: 28px;">architecture</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background">Confecciones Azucena</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Sistema de gestión del taller</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-background" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" style="font-size: 20px;">mail</span>
<input class="w-full pl-[44px] pr-md h-10 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-body-md font-body-md text-on-background placeholder:text-outline-variant focus:border-primary-container focus:ring-[2px] focus:ring-primary-container/20 outline-none transition-all duration-200" id="email" placeholder="tu@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-background" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" style="font-size: 20px;">lock</span>
<input class="w-full pl-[44px] pr-[44px] h-10 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-body-md font-body-md text-on-background placeholder:text-outline-variant focus:border-primary-container focus:ring-[2px] focus:ring-primary-container/20 outline-none transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<!-- Toggle Visibility Button -->
<button class="absolute right-md text-outline hover:text-on-background transition-colors flex items-center justify-center focus:outline-none focus:text-primary-container" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggleIcon" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-base cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant/50 text-primary-container focus:ring-primary-container focus:ring-offset-0 bg-surface-container-lowest transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-background transition-colors">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-surface-tint hover:underline transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-10 mt-sm bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center gap-base hover:bg-surface-tint focus:ring-2 focus:ring-primary-container/50 focus:ring-offset-2 focus:ring-offset-surface-container-lowest active:scale-[0.98] transition-all duration-200" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
</div>
</div>
</div>
<!-- Interactive Script -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
